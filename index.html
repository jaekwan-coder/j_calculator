<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="J 계산기">
<meta name="theme-color" content="#DCE3D9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
<title>J 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#E8EDE6;--paper:#F4F7F2;--bar:#DCE3D9;--ink:#16212A;--muted:#56645E;--line:#CBD6CB;--line-strong:#9FB3A3;
  --key:#FBFCFA;--key-ink:#16212A;--key-fn:#E2E9DF;--key-op:#D9E3EF;--key-eq:#1F4E9C;--key-eq-ink:#FFFFFF;--key-edge:#BFCBC0;
  --gold:#8A6508;--blue:#1F4E9C;--err:#B3261E;
  --plot-bg:#F6F9F4;--grid-minor:#E1E9DF;--grid-major:#C3D2C4;--axis:#46554F;
  --c1:#1F4E9C;--c2:#B3261E;--c3:#2E7D4F;--c4:#9A6F06;--c5:#6B3FA0;--c6:#0F7C7A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bar);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1A18;--paper:#232120;--bar:#151413;--ink:#EEE8DC;--muted:#A69D8F;--line:#36322E;--line-strong:#57514A;
    --key:#2C2926;--key-ink:#EEE8DC;--key-fn:#35312D;--key-op:#28313D;--key-eq:#D9A92E;--key-eq-ink:#1C1A18;--key-edge:#151413;
    --gold:#E0B23A;--blue:#7FAEEA;--err:#F2867D;
    --plot-bg:#1F1D1B;--grid-minor:#292624;--grid-major:#3A3632;--axis:#A69D8F;
    --c1:#7FAEEA;--c2:#F2867D;--c3:#6CC495;--c4:#E0B23A;--c5:#B794E8;--c6:#4FC7C4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1A18;--paper:#232120;--bar:#151413;--ink:#EEE8DC;--muted:#A69D8F;--line:#36322E;--line-strong:#57514A;
  --key:#2C2926;--key-ink:#EEE8DC;--key-fn:#35312D;--key-op:#28313D;--key-eq:#D9A92E;--key-eq-ink:#1C1A18;--key-edge:#151413;
  --gold:#E0B23A;--blue:#7FAEEA;--err:#F2867D;
  --plot-bg:#1F1D1B;--grid-minor:#292624;--grid-major:#3A3632;--axis:#A69D8F;
  --c1:#7FAEEA;--c2:#F2867D;--c3:#6CC495;--c4:#E0B23A;--c5:#B794E8;--c6:#4FC7C4;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-0.01em}
.top-actions{display:flex;gap:6px;align-items:center}
.angle{font-family:var(--mono);font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;border:1px solid var(--line-strong);background:transparent}

main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;display:none;flex-direction:column}
.tab.active{display:flex}

/* calculator */
.history{flex:1;min-height:0;overflow-y:auto;padding:8px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.empty{color:var(--muted);max-width:34em;margin:12px 0;font-size:14px}
.h-item{padding:10px 0;border-bottom:1px solid var(--line)}
.h-expr{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font-family:var(--mono);font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.h-res{display:block;width:100%;text-align:right;background:none;border:0;padding:2px 0 0;font-family:var(--mono);font-size:22px;font-weight:500;overflow-wrap:anywhere}
.h-sub{text-align:right;font-family:var(--mono);font-size:13px;color:var(--gold)}
.h-err{text-align:right;font-size:14px;color:var(--err)}
.entry{padding:6px 16px 2px;background:var(--paper);border-top:1px solid var(--line)}
#expr{width:100%;font-family:var(--mono);font-size:22px;border:0;background:transparent;color:var(--ink);outline:none;padding:6px 0;caret-color:var(--blue)}
#expr::placeholder{color:var(--muted);opacity:.7}
.nat{display:flex;align-items:center;min-height:58px;padding:6px 2px;overflow-x:auto;overflow-y:hidden;font-family:var(--mono);font-size:22px;line-height:1.2;white-space:nowrap;color:var(--ink);outline:none;cursor:text;scrollbar-width:none;-webkit-user-select:none;user-select:none}
.nat::-webkit-scrollbar{display:none}
.nat:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.nat[hidden],#expr[hidden]{display:none}
.mr{display:inline-flex;align-items:center;flex:none}
.t{white-space:pre}
.t.o{padding:0 .1em}
.ph{color:var(--muted);opacity:.7;font-family:var(--sans);font-size:.8em;padding-left:.3em}
.slot{display:inline-flex;align-items:center;justify-content:center;width:.62em;height:.95em;margin:0 .05em;border:1.5px dashed var(--line-strong);border-radius:2px}
.slot.on{border-style:solid;border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.caret{display:inline-block;width:0;height:1.1em;margin:0 -1px;border-left:2px solid var(--blue);animation:blink 1.05s steps(1) infinite}
.slot .caret{height:.75em}
@keyframes blink{50%{opacity:0}}
.mf{display:inline-flex;flex-direction:column;align-items:stretch;margin:0 .14em;font-size:.94em}
.mf>.mr{justify-content:center;padding:0 .12em}
.mf>.mr:first-child{border-bottom:1.5px solid currentColor;padding-bottom:.1em}
.mf>.mr:last-child{padding-top:.1em}
.ms{position:relative;display:inline-flex;align-items:stretch;padding-left:.62em;margin:0 .06em}
.ms>svg{position:absolute;left:0;top:0;width:.64em;height:100%;overflow:visible}
.ms>.mr{border-top:1.5px solid currentColor;padding:.14em .1em 0 .06em}
.mrt{display:inline-flex;align-items:flex-start}
.mrt>.mr:first-child{font-size:.6em;margin-right:-.5em;margin-top:.05em;position:relative;z-index:1}
.mrt>.ms{align-self:center}
.mp{display:inline-flex;flex-direction:column;align-items:flex-start;font-size:.7em}
.mp>.ghost{visibility:hidden;width:0;overflow:hidden;padding-bottom:.8em}
.ml{display:inline-flex;align-items:center}
.ml>.mr:nth-child(2){align-self:flex-end;font-size:.7em;margin-top:.7em}
.ma{display:inline-flex;align-items:center;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;padding:0 .14em;margin:0 .1em}
.h-expr.nx{overflow-x:auto;scrollbar-width:none;font-size:15px;padding:2px 0}
.h-expr.nx::-webkit-scrollbar{display:none}
.h-sub.nx{display:flex;justify-content:flex-end}
.preview.bad{color:var(--err)}
.preview{font-family:var(--mono);font-size:14px;color:var(--muted);min-height:21px;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;background:var(--paper);scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--mono);font-size:14px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--key);color:var(--ink);white-space:nowrap}
.chip.util{font-family:var(--sans);border-color:var(--line-strong)}
.chip.warn{color:var(--err);border-color:var(--err)}
.btn.warn{color:var(--err);border-color:var(--err)}
#clearHist{margin-top:14px}
:root{--vh:100vh}
@supports (height:100dvh){:root{--vh:100dvh}}
.keypad{--kh:clamp(30px,calc((var(--vh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 330px) / 12),44px);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:var(--kh);gap:4px;padding:4px 8px 8px;background:var(--paper);flex:none}
.key{min-width:0;padding:0;border:0;border-radius:8px;font-size:19px;line-height:1;white-space:nowrap;background:var(--key);color:var(--key-ink);box-shadow:inset 0 -2px 0 var(--key-edge);user-select:none;-webkit-user-select:none}
.key.fn{background:var(--key-fn);font-family:var(--mono);font-size:14.5px}
.key.an{background:color-mix(in srgb,var(--key-op) 60%,var(--key-fn));font-family:var(--sans);font-size:14px;font-weight:500}
.key.tall{grid-row:span 2}
.kfr{display:inline-flex;flex-direction:column;align-items:center;gap:2px;vertical-align:middle}
.kfr i,.kb{display:inline-block;width:9px;height:9px;border:1.4px solid currentColor;border-radius:1.5px;vertical-align:middle}
.kfr b{display:block;width:14px;height:1.5px;background:currentColor}
.kbs{display:inline-block;width:6px;height:6px;border:1.2px solid currentColor;border-radius:1px}
.kbs.up{vertical-align:8px;margin-left:1px}
.kbs.dn{vertical-align:-5px;margin-left:1px}
.kbs.pre{vertical-align:8px;margin-right:-1px}
.key.op{background:var(--key-op);color:var(--blue);font-size:20px}
.key.eq{background:var(--key-eq);color:var(--key-eq-ink);font-weight:600;font-size:22px;box-shadow:none}
.key:active{transform:translateY(1px);box-shadow:none}

/* graph */
.flist{max-height:32vh;overflow-y:auto;background:var(--paper);flex:none}
.flist.collapsed{display:none}
.frow{display:flex;align-items:center;gap:10px;padding:2px 8px 2px 14px;border-bottom:1px solid var(--line)}
.swatch{width:22px;height:22px;flex:none;border-radius:50%;border:2.5px solid var(--c);background:var(--c);padding:0}
.swatch[aria-pressed="false"]{background:transparent}
.fexpr{flex:1;min-width:0;font-family:var(--mono);font-size:16px;border:0;background:transparent;color:var(--ink);padding:10px 0;outline:none}
.fdel{flex:none;width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:20px;border-radius:8px}
.ferr{font-size:12px;color:var(--err);padding:0 14px 6px 46px;border-bottom:1px solid var(--line)}
.fbar{display:flex;gap:8px;padding:6px 12px;background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.btn{font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--key);color:var(--ink)}
.sliders{background:var(--paper);flex:none}
.srow{display:flex;align-items:center;gap:10px;padding:4px 12px;border-bottom:1px solid var(--line)}
.slab{font-family:var(--mono);font-size:16px;width:14px}
.srow input[type=range]{flex:1;min-width:0;accent-color:var(--blue)}
.sval{font-family:var(--mono);font-size:14px;width:56px;text-align:right}
.splay{font-size:13px;padding:4px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--key)}
.plotwrap{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none}
.readout{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);background:var(--paper);background:color-mix(in srgb,var(--paper) 92%,transparent);border:1px solid var(--line-strong);border-radius:10px;padding:6px 10px;font-family:var(--mono);font-size:13px;line-height:1.5}
.readout[hidden]{display:none}
.ro-line{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ro-sw{width:9px;height:9px;border-radius:50%;flex:none}
.ro-x{margin-top:4px;font-family:var(--sans);font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.plotbtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.plotbtns button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--paper);font-size:18px}
.plotbtns .small{font-size:12px}
.hint{position:absolute;left:10px;bottom:10px;right:64px;font-size:12.5px;color:var(--muted);pointer-events:none}

/* bode */
.bode-in{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.bode-in label{font-family:var(--mono);font-size:16px;flex:none}
#gexpr{flex:1;min-width:0;font-family:var(--mono);font-size:16px;border:0;background:transparent;color:var(--ink);padding:10px 0;outline:none}
.margins{padding:6px 14px;font-size:13.5px;background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.margins .m-err{color:var(--err)}
.margins .m-val{font-family:var(--mono);color:var(--ink)}
.margins div{color:var(--muted)}

/* tabbar */
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bar);border-top:1px solid var(--line);flex:none}
.tabbar button{border:0;background:none;padding:11px 0 9px;font-size:14px;color:var(--muted);position:relative}
.tabbar button[aria-selected="true"]{color:var(--ink);font-weight:600}
.tabbar button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--blue);border-radius:0 0 2px 2px}

/* examples sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.sheet-panel{width:100%;max-height:78%;overflow-y:auto;background:var(--paper);border-radius:16px 16px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sheet-head h2{margin:0;font-size:16px;font-weight:600}
.ex{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.ex code{display:block;font-family:var(--mono);font-size:14.5px;color:var(--ink);overflow-wrap:anywhere}
.ex span{font-size:13px;color:var(--muted)}
@media (max-height:520px){#tab-calc{overflow-y:auto}.history{flex:none;height:90px}}
@media (prefers-reduced-motion: reduce){.key:active{transform:none}.caret{animation:none}}
</style>
</head>
<body>
<header class="top">
  <h1>J 계산기</h1>
  <div class="top-actions">
    <button id="exBtn" class="angle" type="button">예시</button>
    <button id="kbdBtn" class="angle" type="button" aria-pressed="false" aria-label="텍스트 입력으로 전환">⌨</button>
    <button id="angleBtn" class="angle" type="button" aria-label="각도 단위 전환">RAD</button>
  </div>
</header>

<main>
  <section id="tab-calc" class="tab" aria-label="계산">
    <div id="history" class="history" aria-live="polite"></div>
    <div class="entry">
      <div id="nat" class="nat" tabindex="0" role="textbox" aria-label="수식 (자연 표시)"></div>
      <input id="expr" hidden type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="수식 입력" aria-label="수식">
      <div id="preview" class="preview"></div>
    </div>
    
    <div id="keypad" class="keypad"></div>
  </section>

  <section id="tab-graph" class="tab" aria-label="그래프">
    <div id="flist" class="flist"></div>
    <div class="fbar">
      <button id="addF" class="btn" type="button">함수 추가</button>
      <button id="toggleList" class="btn" type="button">목록 접기</button>
    </div>
    <div id="sliders" class="sliders"></div>
    <div id="plotwrap" class="plotwrap">
      <canvas id="plot" aria-label="함수 그래프"></canvas>
      <div id="readout" class="readout" hidden></div>
      <p id="hint" class="hint">드래그로 이동하고 두 손가락으로 확대해요. 그래프를 탭하면 값이, 점을 탭하면 근, 극값, 교점 좌표가 나와요.</p>
      <div class="plotbtns">
        <button id="zin" type="button" aria-label="확대">+</button>
        <button id="zout" type="button" aria-label="축소">−</button>
        <button id="zreset" class="small" type="button">원점</button>
      </div>
    </div>
  </section>

  <section id="tab-bode" class="tab" aria-label="보드 선도">
    <div class="bode-in">
      <label for="gexpr">G(s) =</label>
      <input id="gexpr" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="10/(s*(s+1)*(s+5))">
    </div>
    <div id="bodePresets" class="chips"></div>
    <div id="margins" class="margins"></div>
    <div id="bodewrap" class="plotwrap">
      <canvas id="bode" aria-label="보드 선도"></canvas>
      <div id="bodeReadout" class="readout" hidden></div>
    </div>
  </section>
</main>

<nav class="tabbar" role="tablist">
  <button type="button" role="tab" data-tab="calc">계산</button>
  <button type="button" role="tab" data-tab="graph">그래프</button>
  <button type="button" role="tab" data-tab="bode">보드 선도</button>
</nav>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="예시">
  <div class="sheet-panel">
    <div class="sheet-head"><h2>예시</h2><button id="sheetClose" class="btn" type="button">닫기</button></div>
    <div id="exList"></div>
    <button id="clearHist" class="btn" type="button">기록 모두 지우기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = {
  get(k, d){ try { const v = localStorage.getItem('jcalc:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('jcalc:' + k, JSON.stringify(v)); } catch (e) {} }
};
const histEl = $('#history');
if (!window.math) { histEl.textContent = '수학 엔진을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침하세요.'; return; }

const M = math.create(math.all);
const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
let scope = {};
let angleMode = store.get('angle', 'rad');

/* ---------- angle mode ---------- */
const orig = {};
['sin','cos','tan','sec','csc','cot','asin','acos','atan','asec','acsc','acot','atan2'].forEach(n => orig[n] = M[n]);
const toRad = x => (angleMode === 'deg' && typeof x === 'number') ? x * Math.PI / 180 : x;
const fromRad = y => (angleMode === 'deg' && typeof y === 'number') ? y * 180 / Math.PI : y;
const ov = {};
['sin','cos','tan','sec','csc','cot'].forEach(n => ov[n] = x => orig[n](toRad(x)));
['asin','acos','atan','asec','acsc','acot'].forEach(n => ov[n] = x => fromRad(orig[n](x)));
ov.atan2 = (y, x) => fromRad(orig.atan2(y, x));

/* ---------- numeric helpers ---------- */
function num(v){
  if (typeof v === 'number') return v;
  if (v == null) return NaN;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (v.isComplex) return Math.abs(v.im) <= 1e-12 * Math.max(1, Math.abs(v.re)) ? v.re : NaN;
  if (v.isBigNumber || v.isFraction) return Number(v.valueOf());
  if (v.isResultSet) return num(v.entries[v.entries.length - 1]);
  return NaN;
}
function normalize(s){
  return String(s)
    .replace(/[“”]/g, '"').replace(/[‘’]/g, "'")

    ], () => { B.trace = null; reqBode(); });
  } else setReadout(bodeRO, null);
}
let bSave = 0;
const saveBodeView = () => { clearTimeout(bSave); bSave = setTimeout(() => { store.set('blo', B.lo); store.set('bhi', B.hi); }, 400); };
const bodeX = () => { const r = bodeCv.getBoundingClientRect(); return { L: 50, pw: r.width - 64 }; };
function setRange(lo, hi){ const span = Math.min(12, Math.max(0.5, hi - lo)), c = (lo + hi) / 2; B.lo = Math.max(-9, Math.min(9 - span, c - span / 2)); B.hi = B.lo + span; }
gestures(bodeCv, {
  snap: () => ({ lo: B.lo, hi: B.hi }),
  pan(dx, dy, s0){ const { pw } = bodeX(), sh = -dx / pw * (s0.hi - s0.lo); setRange(s0.lo + sh, s0.hi + sh); reqBode(); saveBodeView(); },
  pinch(r, m, st){
    const { L, pw } = bodeX(), s0 = st.s, span = (s0.hi - s0.lo) / r;
    const c = s0.lo + (st.m.x - L) / pw * (s0.hi - s0.lo), fr = (m.x - L) / pw;
    setRange(c - fr * span, c - fr * span + span); reqBode(); saveBodeView();
  },
  wheel(f, p){
    const { L, pw } = bodeX(), span = (B.hi - B.lo) / f, c = B.lo + (p.x - L) / pw * (B.hi - B.lo), fr = (p.x - L) / pw;
    setRange(c - fr * span, c - fr * span + span); reqBode(); saveBodeView();
  },
  tap(x){
    const { L, pw } = bodeX(); if (x < L || x > L + pw) return;
    const lw = B.lo + (x - L) / pw * (B.hi - B.lo);
    if (B.trace != null && Math.abs((B.trace - lw) / (B.hi - B.lo) * pw) < 12) B.trace = null; else B.trace = lw;
    reqBode();
  }
});
let gT = 0;
gexpr.addEventListener('input', () => { B.expr = gexpr.value; clearTimeout(gT); gT = setTimeout(() => { store.set('gexpr', B.expr); compileBode(); computeMargins(); renderMargins(); reqBode(); }, 200); });
gexpr.addEventListener('keydown', e => { if (e.key === 'Enter') gexpr.blur(); });
const PRESETS = [
  ['개루프 3차', '10/(s*(s+1)*(s+5))'], ['1차 저역통과', '100/(s+100)'], ['2차 공진', '100/(s^2 + 2*s + 100)'],
  ['노치 필터', '(s^2 + 100)/(s^2 + 5*s + 100)'], ['PI 제어기', '2*(s+1)/s'], ['시간 지연', 'exp(-0.1*s)*10/(s+1)']
];
const presetsEl = $('#bodePresets');
PRESETS.forEach(([label, ex]) => {
  const b = el('button', 'chip util', label); b.type = 'button';
  b.addEventListener('click', () => { gexpr.value = B.expr = ex; store.set('gexpr', ex); B.trace = null; compileBode(); computeMargins(); renderMargins(); setRange(-2, 3); reqBode(); saveBodeView(); });
  presetsEl.appendChild(b);
});

/* ---------- tabs, theme, resize ---------- */
let activeTab = store.get('tab', 'calc');
function showTab(t){
  activeTab = t;
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + t));
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  store.set('tab', t);
  if (t === 'graph') reqGraph();
  if (t === 'bode') reqBode();
}
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const onTheme = () => { readColors(); reqGraph(); reqBode(); };
if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);
if (window.ResizeObserver) { new ResizeObserver(reqGraph).observe($('#plotwrap')); new ResizeObserver(reqBode).observe($('#bodewrap')); }
window.addEventListener('resize', () => { reqGraph(); reqBode(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { reqGraph(); reqBode(); });

/* ---------- home-screen icon ---------- */
(function(){
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  x.fillStyle = '#1C1A18'; x.fillRect(0, 0, 180, 180);
  x.strokeStyle = '#3A3632'; x.lineWidth = 2;
  for (let i = 30; i < 180; i += 30) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 180); x.moveTo(0, i); x.lineTo(180, i); x.stroke(); }
  x.strokeStyle = '#E0B23A'; x.lineWidth = 9; x.lineCap = 'round'; x.beginPath();
  for (let i = 0; i <= 140; i++) { const px = 20 + i, py = 90 - 42 * Math.sin(i / 140 * Math.PI * 2); i ? x.lineTo(px, py) : x.moveTo(px, py); }
  x.stroke();
  const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
})();

readColors(); syncAngle(); renderHist(); compileAll(); renderFuncList(); renderSliders();
compileBode(); computeMargins(); renderMargins();
showTab(['calc','graph','bode'].includes(activeTab) ? activeTab : 'calc');
})();
</script>
